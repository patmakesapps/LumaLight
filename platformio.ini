; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel
    pololu/VL53L1X

; Flash over Wi-Fi: pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = lumalight.local
; Flashing password lives in secrets.ini

; Gift build for other people: no Wi-Fi, no passwords inside. Flash over USB:
; pio run -e gift -t upload
[env:gift]
extends = env:esp32dev
build_flags = -DNO_WIFI
